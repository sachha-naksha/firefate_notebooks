  VELOCITY_STREAM_OBS:   "{velocity_in}/adata_stream_obs.tsv.gz"
  VELOCITY_STREAM_TRAJ:  "{velocity_in}/stream_outs/stream_traj_v6.pkl"
  VELOCITY_TMP:          "{velocity_in}/tmp"
  VELOCITY_IN_BASE:      "{velocity_in}"

  # --- Motif databases (DEAD root) ------------------------------------------
  # dynamic_grn/data_prep_and_checks
  MOTIF_DIR:             "{motifs}"
  MOTIF_CISBP_MEME:      "{motifs}/CisBP_Human_FigR_meme"
  MOTIF_JASPAR:          "{motifs}/JASPAR2020_vertebrates.motif"
  MOTIF_HOCOMOCO:        "{motifs}/hocomoco_human.motif"


groups:
  # State-discriminative latent factors, per branch
  PB:
    template: "{enrichment}/enrichment_ep{i}_pb.csv"
    n_episodes: 4
  GC:
    template: "{enrichment}/enrichment_ep{i}_gc.csv"
    n_episodes: 4

  # TF knockouts (B cell)
  IRF4:
    template: "{inputs}/irf4_ko/gc_98/enrichment_episode_{i}.csv"
    n_episodes: 8
  BLIMP1:
    template: "{inputs}/prdm1_ko/gc_98/enrichment_episode_{i}.csv"
    n_episodes: 8

  # TF knockouts (T cell) -- DEAD root
  ETS1_SIG:
    template: "{tcell}/output/ets1/sig_LFs/enrichment_episode_{i}.csv"
    n_episodes: 6
  ETS1_ALL:
    template: "{tcell}/output/ets1/all_lfs/enrichment_episode_{i}.csv"
    n_episodes: 6
  IKZF1_SIG:
    template: "{tcell}/output/ikzf1/sig_lfs/enrichment_episode_{i}.csv"
    n_episodes: 6
  IKZF1_ALL:
    template: "{tcell}/output/ikzf1/all_lfs/enrichment_episode_{i}.csv"
    n_episodes: 6
